<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1f2d3a" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <!-- Instalado en la pantalla de inicio se abre a pantalla completa y horizontal (Android e iPhone) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Reponedor" />
  <title>Misión Reponedor</title>
  <!-- Vista previa al compartir el link (WhatsApp, Facebook, Telegram, X). WhatsApp necesita la imagen con
       URL completa: el build pone la dirección de "sitio" de package.json (ver vite.config.js). -->
  <meta name="description" content="Juego educativo para aprender el trabajo de reponedor de supermercado. Todo con imágenes y voz, sin necesidad de leer." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Misión Reponedor" />
  <meta property="og:locale" content="es_CL" />
  <meta property="og:title" content="Misión Reponedor" />
  <meta property="og:description" content="Juego para aprender el trabajo de reponedor de supermercado. Todo con imágenes y voz." />
  <meta property="og:url" content="%SITIO%" />
  <meta property="og:image" content="%SITIO%compartir.jpg" />
  <meta property="og:image:secure_url" content="%SITIO%compartir.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Portada del juego: fachada del Supermercado El Barrio y un reponedor con chaleco violeta." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Misión Reponedor" />
  <meta name="twitter:description" content="Juego para aprender el trabajo de reponedor de supermercado. Todo con imágenes y voz." />
  <meta name="twitter:image" content="%SITIO%compartir.jpg" />
  <style>
    html, body { margin: 0; height: 100%; background: #1f2d3a; overflow: hidden; touch-action: none; }
    /* Celular: un toque largo no abre el menú de copiar/guardar imagen, sin "tirar para recargar" */
    body {
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
    }
    /* dvh: altura real visible en celulares (sin la barra del navegador) */
    /* Alto visible real: --alto lo mide el script de abajo (en Safari de iPhone 100vh y a veces 100dvh
       incluyen las barras del navegador y el juego se corta abajo). */
    #juego { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; height: var(--alto, 100dvh); }
    /* Campo de texto sobre el canvas (src/lib/movil.js: campoTexto ubica y escala) */
    input.campo {
      position: fixed; z-index: 5; box-sizing: border-box; margin: 0; padding: 0 0.6em;
      font-weight: 700; font-family: system-ui, sans-serif; color: #1f2d3a; background: #fff;
      border: 4px solid #553c9a; border-radius: 12px; outline: none; text-align: center;
      -webkit-appearance: none; appearance: none; -webkit-user-select: text; user-select: text;
    }
    /* Aviso en iPhone con Safari: cómo agregarlo a la pantalla de inicio (src/lib/movil.js) */
    .aviso-instalar {
      position: fixed; z-index: 6; top: 8px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; max-width: 92vw;
      background: #fff; color: #1f2d3a; border-radius: 14px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      font: 600 15px system-ui, sans-serif;
    }
    .aviso-instalar svg { width: 26px; height: 26px; flex: none; }
    .aviso-instalar button {
      flex: none; width: 36px; height: 36px; border: 0; border-radius: 10px;
      background: #edf2f7; color: #1f2d3a; font: 700 18px system-ui, sans-serif;
    }

    /* Aviso para girar el celular (solo pantallas táctiles en vertical) */
    #girar {
      display: none; position: fixed; inset: 0; z-index: 10;
      background: #1f2d3a; color: #fff; font: 700 26px system-ui, sans-serif;
      flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center;
    }
    #girar svg { width: 140px; height: 140px; animation: girar 2.4s ease-in-out infinite; }
    @keyframes girar {
      0%, 25% { transform: rotate(0deg); }
      55%, 100% { transform: rotate(-90deg); }
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #girar { display: flex; }
    }
  </style>
</head>
<body>
  <div id="juego"></div>
  <div id="girar" role="alert">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect x="28" y="8" width="44" height="84" rx="8" fill="#38b2ac" />
      <rect x="33" y="17" width="34" height="62" rx="3" fill="#e6fffa" />
      <circle cx="50" cy="85" r="3.5" fill="#e6fffa" />
    </svg>
    <div>Gira tu celular</div>
  </div>
  <script>
    (() => {
      const vv = window.visualViewport;
      const medir = () => document.documentElement.style.setProperty('--alto', `${Math.round(vv ? vv.height : innerHeight)}px`);
      medir();
      addEventListener('resize', medir);
      addEventListener('orientationchange', () => setTimeout(medir, 300));
      vv?.addEventListener('resize', medir);
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
